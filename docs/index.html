<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0C0B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Daily Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --bg: #0D0C0B;
    --raise: #15130F;
    --ink: #F4EFE7;
    --dim: #988F83;
    --faint: #645C53;
    --rule: #272320;
    --edge: #E8B45A;
    --edge-soft: rgba(232,180,90,.11);
    --lens: #7FD4C4;
    --lens-soft: rgba(127,212,196,.10);
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  :root[data-theme="light"], html.light {
    --bg: #FAF8F4; --raise: #FFFFFF; --ink: #15120E; --dim: #6A6155; --faint: #9A9185;
    --rule: #E6DFD3; --edge: #9A6A12; --edge-soft: rgba(154,106,18,.08);
    --lens: #157D6D; --lens-soft: rgba(21,125,109,.08);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #FAF8F4; --raise: #FFFFFF; --ink: #15120E; --dim: #6A6155; --faint: #9A9185;
      --rule: #E6DFD3; --edge: #9A6A12; --edge-soft: rgba(154,106,18,.08);
      --lens: #157D6D; --lens-soft: rgba(21,125,109,.08);
    }
  }
  * { box-sizing: border-box; margin: 0; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    padding: 0 0 64px; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(90% 55% at 50% 0%, rgba(232,180,90,.07), transparent 70%);
  }
  .wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 0 20px; }

  /* ---------- masthead ---------- */
  header { padding: 34px 0 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand {
    font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--edge);
  }
  .readtime {
    font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px;
    white-space: nowrap;
  }
  h1.date {
    font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 10vw, 46px);
    line-height: 1.04; letter-spacing: -.015em; margin: 16px 0 6px;
  }
  h1.date em { font-style: italic; color: var(--dim); }
  .strip {
    display: flex; align-items: flex-start; gap: 10px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 12px 0; margin-top: 18px; font-size: 13.5px; color: var(--dim);
  }
  .strip .t { font-weight: 700; color: var(--ink); white-space: nowrap; }

  /* ---------- section headers ---------- */
  section { margin-top: 46px; }
  .shead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .snum {
    font-family: var(--serif); font-size: 15px; line-height: 1;
    color: var(--bg); background: var(--edge);
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
  }
  .lens-wrap .snum { background: var(--lens); }
  .slabel {
    font-size: 11.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink);
  }
  .shead .line { flex: 1; height: 1px; background: var(--rule); }

  /* ---------- edge ---------- */
  .chip {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--edge); background: var(--edge-soft);
    border-radius: 999px; padding: 5px 11px; margin-bottom: 14px;
  }
  .lens-wrap .chip { color: var(--lens); background: var(--lens-soft); }
  .title {
    font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8.4vw, 40px);
    line-height: 1.08; letter-spacing: -.015em; margin-bottom: 16px;
  }
  .anchor {
    font-size: 13.5px; color: var(--dim); font-style: italic;
    border-left: 2px solid var(--edge); padding-left: 12px; margin-bottom: 20px;
  }
  .body { font-size: 15.5px; color: var(--dim); }
  .body + .body { margin-top: 12px; }

  .tell {
    position: relative; margin: 28px 0; padding: 22px 20px 22px 22px;
    background: var(--edge-soft); border-left: 3px solid var(--edge);
    border-radius: 0 12px 12px 0;
  }
  .tell .lab {
    font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--edge); margin-bottom: 9px;
  }
  .tell p {
    font-family: var(--serif); font-size: clamp(21px, 5.6vw, 26px); line-height: 1.26;
    letter-spacing: -.01em; color: var(--ink);
  }

  .blk { margin-top: 26px; }
  .blab {
    font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 12px;
  }
  ol.moves { list-style: none; counter-reset: m; padding-left: 0; }
  ol.moves li {
    counter-increment: m; position: relative; padding-left: 34px; margin-bottom: 13px;
    font-size: 15px; color: var(--ink);
  }
  ol.moves li::before {
    content: counter(m); position: absolute; left: 0; top: 1px;
    font-family: var(--serif); font-size: 15px; color: var(--edge);
    width: 22px; height: 22px; border: 1px solid var(--edge); border-radius: 50%;
    display: grid; place-items: center; line-height: 1;
  }
  .variants {
    margin-top: 16px; font-size: 13px; color: var(--faint);
    border-top: 1px solid var(--rule); padding-top: 14px;
  }
  .variants b { color: var(--dim); font-weight: 600; }

  /* ---------- lens ---------- */
  .lead { font-size: 18px; line-height: 1.45; color: var(--ink); margin-bottom: 14px; }
  .today {
    margin: 22px 0; padding: 18px 18px 18px 20px;
    background: var(--lens-soft); border-left: 3px solid var(--lens);
    border-radius: 0 12px 12px 0;
  }
  .today .lab { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--lens); margin-bottom: 9px; }
  .today p { font-size: 15px; color: var(--ink); }
  ul.elsewhere { list-style: none; padding-left: 0; }
  ul.elsewhere li {
    position: relative; padding-left: 20px; margin-bottom: 9px; font-size: 14.5px; color: var(--dim);
  }
  ul.elsewhere li::before {
    content: ""; position: absolute; left: 2px; top: 10px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--lens);
  }
  .carrythis {
    margin-top: 24px; padding: 18px 20px; border: 1px dashed var(--rule); border-radius: 12px;
  }
  .carrythis .lab { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; }
  .carrythis p { font-family: var(--serif); font-size: 19px; line-height: 1.35; color: var(--ink); }

  /* ---------- moved ---------- */
  .mrow { border-top: 1px solid var(--rule); padding: 18px 0; }
  .mrow:last-of-type { border-bottom: 1px solid var(--rule); }
  .mtag {
    font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 7px;
  }
  .mwhat { font-size: 15.5px; color: var(--ink); margin-bottom: 8px; line-height: 1.5; }
  .mso { position: relative; padding-left: 18px; font-size: 14.5px; color: var(--dim); }
  .mso::before {
    content: ""; position: absolute; left: 0; top: 9px; width: 10px; height: 1px; background: var(--edge);
  }

  /* ---------- carry over ---------- */
  .co { margin-top: 44px; padding: 20px; border: 1px solid var(--rule); border-radius: 14px; background: var(--raise); }
  .co .lab { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
  .co p { font-size: 15px; color: var(--ink); }
  .co .note { font-size: 13.5px; color: var(--dim); }
  .co button {
    margin-top: 14px; font: inherit; font-size: 14px; font-weight: 600;
    background: transparent; color: var(--edge); border: 1px solid var(--edge);
    border-radius: 999px; padding: 9px 18px; cursor: pointer;
  }
  .co .ans { margin-top: 14px; font-size: 14.5px; color: var(--dim); display: none; }
  .co .ans.show { display: block; }

  .notify {
    display: none; width: 100%; font: inherit; font-size: 15px; font-weight: 600;
    background: var(--edge); color: var(--bg); border: none;
    border-radius: 12px; padding: 14px; margin-top: 34px; cursor: pointer;
  }
  .notify.on { background: transparent; color: var(--dim); border: 1px solid var(--rule); }

  footer {
    margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--rule);
    font-size: 12px; color: var(--faint); line-height: 1.7;
  }
  .err { font-family: var(--serif); font-size: 22px; color: var(--dim); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="top">
      <div class="brand">Daily Pulse</div>
      <div class="readtime" id="readtime">—</div>
    </div>
    <h1 class="date" id="date">Loading<em>…</em></h1>
    <div class="strip" id="strip" hidden></div>
  </header>

  <section id="edge-wrap" hidden>
    <div class="shead"><div class="snum">1</div><div class="slabel">The Edge</div><div class="line"></div></div>
    <div id="edge"></div>
  </section>

  <section id="lens-wrap" class="lens-wrap" hidden>
    <div class="shead"><div class="snum">2</div><div class="slabel">The Lens</div><div class="line"></div></div>
    <div id="lens"></div>
  </section>

  <section id="moved-wrap" hidden>
    <div class="shead"><div class="snum">3</div><div class="slabel">What moved</div><div class="line"></div></div>
    <div id="moved"></div>
  </section>

  <div class="co" id="co" hidden></div>
  <button class="notify" id="notify">Enable daily notifications</button>

  <footer>
    One trap decoded, one model, and only what changes your day.<br>
    Refreshed morning and evening from open sources.
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

async function main() {
  const r = await fetch("data/brief.json?t=" + Date.now());
  if (!r.ok) throw new Error("HTTP " + r.status);
  const b = await r.json();

  // masthead
  const d = new Date(b.date + "T00:00:00");
  const day = d.toLocaleDateString("en-IN", { weekday: "long" });
  const rest = d.toLocaleDateString("en-IN", { day: "numeric", month: "long" });
  $("date").innerHTML = esc(day) + "<em> · " + esc(rest) + "</em>";
  $("readtime").textContent = (b.read_seconds || 60) + " sec read";
  document.title = "Daily Pulse · " + rest;

  // weather strip
  if (b.weather) {
    const w = b.weather;
    $("strip").innerHTML =
      '<span class="t">' + Math.round(w.now_c) + "° " + esc(w.condition) + "</span>" +
      "<span>" + esc(w.tip || "") + "</span>";
    $("strip").hidden = false;
  }

  // ---- the edge ----
  if (b.edge) {
    const e = b.edge;
    let h = '<div class="chip">' + esc(e.category) + "</div>";
    h += '<div class="title">' + esc(e.title) + "</div>";
    if (e.anchor) h += '<div class="anchor">' + esc(e.anchor) + "</div>";
    h += '<p class="body">' + esc(e.setup) + "</p>";
    h += '<div class="tell"><div class="lab">The tell</div><p>' + esc(e.tell) + "</p></div>";
    h += '<div class="blk"><div class="blab">Your move</div><ol class="moves">' +
         e.move.map((m) => "<li>" + esc(m) + "</li>").join("") + "</ol></div>";
    h += '<div class="blk"><div class="blab">Why it works</div><p class="body">' + esc(e.why) + "</p>";
    if (e.variants) h += '<div class="variants"><b>Same shape:</b> ' + esc(e.variants) + "</div>";
    h += "</div>";
    $("edge").innerHTML = h;
    $("edge-wrap").hidden = false;
  }

  // ---- the lens ----
  if (b.lens) {
    const l = b.lens;
    let h = '<div class="chip">Mental model</div>';
    h += '<div class="title">' + esc(l.name) + "</div>";
    h += '<p class="lead">' + esc(l.one_line) + "</p>";
    h += '<p class="body">' + esc(l.detail) + "</p>";
    if (l.today) h += '<div class="today"><div class="lab">Where it showed up today</div><p>' + esc(l.today) + "</p></div>";
    if (l.elsewhere && l.elsewhere.length) {
      h += '<div class="blk"><div class="blab">Same shape elsewhere</div><ul class="elsewhere">' +
           l.elsewhere.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
    }
    if (l.test) h += '<div class="carrythis"><div class="lab">Carry this</div><p>' + esc(l.test) + "</p></div>";
    $("lens").innerHTML = h;
    $("lens-wrap").hidden = false;
  }

  // ---- what moved ----
  if (b.moved && b.moved.length) {
    $("moved").innerHTML = b.moved.map((m) =>
      '<div class="mrow"><div class="mtag">' + esc(m.tag) + "</div>" +
      '<div class="mwhat">' + esc(m.what) + "</div>" +
      '<div class="mso">' + esc(m.so_what) + "</div></div>"
    ).join("");
    $("moved-wrap").hidden = false;
  }

  // ---- carry-over ----
  const co = $("co");
  if (b.carry_over) {
    const c = b.carry_over;
    co.innerHTML = '<div class="lab">Yesterday, five seconds</div><p>' + esc(c.prompt) + "</p>" +
      '<button id="co-btn">Show the tell</button>' +
      '<div class="ans" id="co-ans">' + esc(c.answer) + "</div>";
    co.hidden = false;
    $("co-btn").onclick = (ev) => {
      $("co-ans").classList.add("show");
      ev.target.style.display = "none";
      try { localStorage.setItem("pulse-carry", b.date); } catch (_) {}
    };
  } else if (b.first_run_note) {
    co.innerHTML = '<div class="lab">Yesterday, five seconds</div><p class="note">' + esc(b.first_run_note) + "</p>";
    co.hidden = false;
  }
}

main().catch((e) => {
  $("date").innerHTML = "Couldn't load<em> today's brief</em>";
  $("readtime").textContent = "offline";
  const p = document.createElement("div");
  p.className = "err";
  p.textContent = e.message;
  $("app").appendChild(p);
});

// ---- PWA ----
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(setupPush).catch(() => {});
}
function urlB64ToUint8Array(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function setupPush(reg) {
  const cfg = window.PULSE_CONFIG || {};
  const btn = $("notify");
  if (!cfg.pushWorkerUrl || !("PushManager" in window) || !("Notification" in window)) return;
  const isIOS = /iPhone|iPad/.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (isIOS && !standalone) return;
  const existing = await reg.pushManager.getSubscription();
  btn.style.display = "block";
  if (existing) { btn.textContent = "Notifications on"; btn.classList.add("on"); return; }
  btn.onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== "granted") return;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(cfg.vapidPublicKey),
      });
      const res = await fetch(cfg.pushWorkerUrl + "/subscribe", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub),
      });
      if (!res.ok) throw new Error("subscribe failed: " + res.status);
      btn.textContent = "Notifications on";
      btn.classList.add("on");
    } catch (err) {
      btn.textContent = "Couldn't enable: " + err.message;
    }
  };
}
</script>
</body>
</html>
